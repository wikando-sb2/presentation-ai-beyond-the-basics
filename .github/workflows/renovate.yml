name: Renovate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate.yml
  schedule:
    - cron: "0 6,12,18 * * 1-5"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run Renovate without changing repository state
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  validate-config:
    name: renovate config validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration in full dry-run mode
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        env:
          LOG_LEVEL: debug
          RENOVATE_BASE_BRANCHES: ${{ github.head_ref }}
          RENOVATE_DRY_RUN: full
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_USE_BASE_BRANCH_CONFIG: merge
        with:
          token: ${{ github.token }}
          env-regex: '^(?:LOG_LEVEL|RENOVATE_\w+)$'

  renovate:
    name: renovate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Renovate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RENOVATE }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        env:
          LOG_LEVEL: ${{ inputs.dry-run && 'debug' || 'info' }}
          RENOVATE_BASE_BRANCHES: main
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          env-regex: '^(?:LOG_LEVEL|RENOVATE_\w+)$'
